<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Inovaraa Solutions</title>
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="inv-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="120" height="120" rx="30" fill="url(#inv-bg)"/>
  <rect width="120" height="120" rx="30" fill="url(#inv-shine)"/>

  <!-- Orbit around the spark -->
  <ellipse cx="60" cy="36" rx="31" ry="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" transform="rotate(-18 60 36)"/>
  <circle cx="89" cy="27" r="4.5" fill="#FFFFFF"/>

  <!-- Spark = the dot of the "i" -->
  <path d="M60 15 Q64 32 81 36 Q64 40 60 57 Q56 40 39 36 Q56 32 60 15 Z" fill="#FFFFFF"/>

  <!-- Stem of the "i" -->
  <line x1="60" y1="70" x2="60" y2="96" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
</svg>
