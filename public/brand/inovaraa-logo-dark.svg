<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-labelledby="t">
  <title id="t">Inovaraa Solutions</title>
  <!-- For dark backgrounds: light wordmark -->
  <defs>
