      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="inv-shine" x1="0" y1="0" x2="0" y2="1">
